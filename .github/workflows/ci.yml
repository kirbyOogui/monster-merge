name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monster-merge/package-lock.json
      - run: npm ci
        working-directory: monster-merge
      - run: npm run typecheck
        working-directory: monster-merge
      - run: npm run lint
        working-directory: monster-merge
      - run: npm run test
        working-directory: monster-merge
      - run: npm run build
        working-directory: monster-merge
